name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push to a branch cancels the run still going on it (a tag, a PR and another branch each
# have their own).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  FACTORIO_VERSION: "2.1.23"

# Every job: a pinned runner image (ubuntu-latest moves to a new Ubuntu by itself), a time limit, a
# one-line result per job in the run's summary with each failing check named (and as an error
# annotation), and its logs uploaded when it fails.
jobs:
  # The same command as locally (docs/RUNNING.md "Tests"): the Lua suites against the fake Factorio
  # API, the mock over UDP, gdparse, the models' check and both fuzzers, each once, then a table.
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install "lupa==2.*" "gdtoolkit==4.*"
      - name: The fast suites (tools/check.py --all)
        timeout-minutes: 15
        run: python tools/check.py --all fast --logs ci-logs
      - name: Upload the suites' output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tests-logs
          path: ci-logs/
          if-no-files-found: ignore

  # The client's headless Godot tests (UI test, packet fuzzing, decoratives, mods' files, model packs, add-ons, VR,
  # model loading), through check.py as locally: each fails on its exit code or on any SCRIPT ERROR
  # (a GDScript runtime error only stops that call), and all run even when one fails. Without a
  # Factorio install the UI falls back to flat panels, which is what this checks: input paths and
  # model hooks, not looks.
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
      - name: Import the project
        timeout-minutes: 10
        run: ~/godot/godot --headless --path client --log-file "$PWD/ci-logs/import.godot.log" --import
      # Each test stops itself on a parse error or past its time limit (client/tests/test_watchdog.gd),
      # and check.py stops one that still runs a minute later.
      - name: The Godot tests (tools/check.py --all godot)
        timeout-minutes: 20
        run: GODOT="$HOME/godot/godot" python tools/check.py --all godot --logs ci-logs
      - name: Upload the tests' output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-logs
          path: ci-logs/
          if-no-files-found: ignore

  # The bridge mod in the real game: Factorio's free Linux headless build, a new map, then
  # tools/live_check.py over UDP and RCON, as on a desktop PC.
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache Factorio
        id: factorio-cache
        uses: actions/cache@v6
        with:
          path: server/factorio
          key: factorio-headless-${{ env.FACTORIO_VERSION }}
      - name: Download Factorio
        if: steps.factorio-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: server/download-headless.sh "$FACTORIO_VERSION"
      - name: Start the server
        timeout-minutes: 5
        # One map for every run: a new random map each time put trees, cliffs or water where
        # some check works, and a different check failed on each run. Seed 123456 passes them all
        # (checked on Factorio 2.1.23).
        env:
          MAP_SEED: "123456"
        run: |
          server/run-headless.sh > server/server.log 2>&1 &
          for i in $(seq 90); do
            if grep -q "Hosting game at" server/server.log 2>/dev/null && (exec 3<>/dev/tcp/127.0.0.1/34198) 2>/dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          cat server/server.log; exit 1
      - name: live_check
        timeout-minutes: 25
        run: |
          set -o pipefail
          python tools/live_check.py 2>&1 | tee live_check.log
      - name: Summary
        if: always()
        run: python tools/ci_summary.py live_check live_check.log
      - name: Server log
        if: failure()
        run: tail -200 server/server.log
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-logs
          path: |
            live_check.log
            server/server.log
            server/data/factorio-current.log
          if-no-files-found: ignore

  # What the bridge costs on a big base: tools/busy_base.py builds 20,000+ entities (belt loops,
  # assemblers, a main bus, a train, robots, walls) next to the character in headless Factorio,
  # then profiles the mod per module with a client connected. Fails on a big regression against
  # tools/busy_budget.json; the numbers are uploaded either way.
  busy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache Factorio
        id: factorio-cache
        uses: actions/cache@v6
        with:
          path: server/factorio
          key: factorio-headless-${{ env.FACTORIO_VERSION }}
      - name: Download Factorio
        if: steps.factorio-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: server/download-headless.sh "$FACTORIO_VERSION"
      - name: Start the server
        timeout-minutes: 5
        # The same map as the live job.
        env:
          MAP_SEED: "123456"
        run: |
          server/run-headless.sh > server/server.log 2>&1 &
          for i in $(seq 90); do
            if grep -q "Hosting game at" server/server.log 2>/dev/null && (exec 3<>/dev/tcp/127.0.0.1/34198) 2>/dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          cat server/server.log; exit 1
      # The decoratives' pictures (file names and numbers only) for client/data/decoratives.json,
      # from this Factorio's prototypes: compared with the committed file, printed when it differs.
      - name: Decorative index is current
        timeout-minutes: 5
        run: |
          python tools/decor_index.py --factorio server/factorio --out decoratives.json
          if ! cmp -s decoratives.json client/data/decoratives.json; then
            echo "client/data/decoratives.json differs from this Factorio's; new one:"; cat decoratives.json; echo
          fi
      - name: Build a big base and measure the bridge
        timeout-minutes: 20
        run: |
          set -o pipefail
          python tools/busy_base.py --big --measure busy.json --budget tools/busy_budget.json 2>&1 | tee busy.log
      - name: Summary
        if: always()
        run: python tools/ci_summary.py busy_base busy.log
      - name: Upload the numbers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: busy
          path: |
            busy.json
            busy.log
          if-no-files-found: ignore
      - name: Server log
        if: always()
        run: tail -200 server/server.log
      - name: Upload the server's log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: busy-server-log
          path: |
            server/server.log
            server/data/factorio-current.log
          if-no-files-found: ignore
