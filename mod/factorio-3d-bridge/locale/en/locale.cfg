[mod-setting-name]
f3d-zenith-button=Zenith button
f3d-surface=Surface to stream
f3d-chunks-per-tick=Chunk snapshots per tick
f3d-bytes-per-tick=Bytes sent per tick
f3d-max-focus-radius=Max live-update radius (tiles)
f3d-mover-interval=Moving entity update interval (ticks)
f3d-detail-radius=Belt item, ground item and inserter radius (tiles)
f3d-detail-interval=Belt item and inserter update interval (ticks)
f3d-starter-kit=Give the puppet character a starter kit
f3d-player=Player to play as
f3d-act-as-player=Act as the player for other mods

[mod-setting-description]
f3d-zenith-button=Shows Zenith's button at the top left, beside other mods' buttons: it does what Ctrl+F9 does.
f3d-surface=Surface the puppet character is created on and the 3D client sees. Ignored in single-player, where the player's own surface is used.
f3d-chunks-per-tick=How many 32x32 chunks are read and sent per tick while the client loads the world. Raise it for faster loading, lower it if the game stutters.
f3d-bytes-per-tick=Upper bound on queued world data sent to the client each tick. Keeps the client's UDP receive buffer from overflowing.
f3d-max-focus-radius=Moving things (biters, trains, robots) and machine states are only streamed within this distance of the client's camera.
f3d-mover-interval=Lower is smoother but costs more script time.
f3d-detail-radius=Items on the ground, inserter hands, fluids, heat, robots' cargo and plants' growth are streamed within this distance of the client's camera (and never beyond the live-update radius). 0 turns them off. Items on belts go as far as Zenith's own Belt item distance (Settings → Graphics); this distance is used for them only by clients that don't send theirs. Lower it if a dense base slows the game down.
f3d-detail-interval=Ticks between belt item and inserter updates. The client glides items and arms in between, so lower is only slightly smoother but costs more script time.
f3d-starter-kit=When the bridge creates its own character on a server, give it the same items a new freeplay player gets.
f3d-player=Name of the player whose character the 3D client plays on a server. While they're not connected, the bridge's character stands in where theirs was and carries their inventory, armour, guns, logistic requests and crafting queue; they get it all back when they join. Empty: the player who was online last (the owner of a save played alone). /f3d-player changes it while the game runs.
f3d-act-as-player=When the client plays a player's own character (single-player, or f3d-player while they're connected), build, mine, rotate, paste settings and open machines through that player, so other mods get the same events as when the player does it in Factorio. Off: the bridge acts by script, and mods that only listen for player events don't see it.

[command-help]
f3d-status=Show the Zenith bridge status: the clients, the character, the bridge's cost.
f3d-selftest=Check the Zenith bridge's character API in this game (single-player or server).
f3d-platform=Space platforms for the Zenith bridge's character: list | new [planet] | board <platform> | leave [planet].
f3d-player=Whose character the Zenith client plays: /f3d-player lists the players; /f3d-player <name> | none picks.
f3d-profile=Time the Zenith bridge's modules (on/off); /f3d-status shows it. /f3d-profile trace also logs every tick's times.
f3d-rate=Slow the Zenith bridge's costliest updates down: 0 (normal) to 3.

[controls]
f3d-show-3d=Show in Zenith (3D)

[controls-description]
f3d-show-3d=Brings the Zenith 3D client's window to the front, on the same game. With no client connected, starts Zenith (when Factorio was started with Zenith's launcher, server/factorio-with-zenith.ps1). Ctrl+F9 in the client comes back here.

[f3d-launch]
title=Zenith
button=Show in Zenith (Ctrl+F9): the same game in 3D, starting Zenith if it isn't open
intro=Zenith shows this game in 3D, in a window of its own. It is a separate program: this mod is only its bridge to Factorio. To open it from here:
step1=1. Get Zenith: download it from the page below, unpack it anywhere, and open Zenith.exe once. It then remembers where it is.
step1-moved=1. Zenith isn't where it was last opened: it was moved or removed. Open Zenith.exe once from where it is now, or download it again from the page below.
step2=2. Start Factorio with Zenith's launch options: in Steam, right-click Factorio > Properties > Launch options, paste the line below in place of what is there, and restart Factorio. Do step 1 first: opening Zenith puts the launcher where this line points.
step2-done=2. Factorio was started with Zenith's launch options: done.
copy=To copy a box: click it, then Ctrl+A and Ctrl+C.
then=Then this button, or Ctrl+F9, opens this game in Zenith.
or=Not on Steam, or would rather not change the launch options? Start Factorio with --enable-lua-udp 34200, open Zenith yourself and use Play > Connect to address, 127.0.0.1:34200.
close=Close
starting=[Zenith] Opening Zenith: it comes to the front once it has joined this game.
raising=[Zenith] Switching to Zenith.
raise-lost=[Zenith] The Zenith that was connected isn't answering (closed or stuck): starting a new one.
